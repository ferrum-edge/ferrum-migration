name: Release

# A pushed tag vX.Y.Z (strict X.Y.Z, equal to ferrum_migration.__version__, on a commit
# reachable from main, with a dated `## [X.Y.Z]` CHANGELOG.md section) runs the full CI,
# builds the sdist and the wheel, attests them, and creates the GitHub release. PyPI
# publishing runs only when the repository variable PYPI_PUBLISH is `true`.
# See docs/releasing.md.

on:
  push:
    tags:
      - "v*"

# Every job states its own permissions; this default covers any job that does not.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate tag, version and changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      pypi_publish: ${{ steps.pypi.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Require tag == v + package version (strict X.Y.Z)
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(python scripts/release_check.py tag --tag "$RELEASE_TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require the tag to name this run's commit, reachable from main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "::error::tag ${RELEASE_TAG} names ${tag_commit}, but this run is for ${GITHUB_SHA}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release tags must point to a commit reachable from main"
            exit 1
          fi

      - name: Read the PyPI opt-in (exactly `true`, case-sensitive)
        # GitHub expression comparisons ignore case; this shell comparison does not, so only
        # PYPI_PUBLISH=true (not TRUE or True) enables the pypi job.
        id: pypi
        env:
          PYPI_PUBLISH: ${{ vars.PYPI_PUBLISH }}
        run: |
          if [ "${PYPI_PUBLISH:-}" = "true" ]; then publish=true; else publish=false; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "PyPI publishing for this release: $publish"

      - name: Extract the release notes from CHANGELOG.md
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-notes
          python scripts/release_check.py notes --version "$RELEASE_VERSION" --out release-notes/RELEASE_NOTES.md
          cat release-notes/RELEASE_NOTES.md

      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30

  ci:
    name: ci
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: build sdist and wheel
    needs: [validate, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-release.txt

      - name: Build sdist, then the wheel from the sdist
        run: python -m build --outdir dist .

      - name: Check the distributions
        run: |
          set -euo pipefail
          python -m twine check --strict dist/*
          python scripts/release_check.py dist --dir dist

      - name: Install the exact wheel to be released into a clean venv and run it
        run: bash scripts/smoke-wheel.sh dist

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  attest:
    # Runs no third-party build tooling: it only signs the digests of the files the build
    # job produced, with the run's OIDC identity.
    name: attest build provenance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: artifacts

      - name: Verify SHA256SUMS
        working-directory: artifacts/dist
        run: sha256sum --strict -c ../SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/dist/*.tar.gz
            artifacts/dist/*.whl
          # Storage records describe registry artifacts and need artifact-metadata:write.
          create-storage-record: false

  github-release:
    # Idempotent: a re-run accepts a release that already exists for the tag only if its
    # assets are exactly this run's files (SHA-256), so a retry after a lost job result can
    # still reach the PyPI job.
    name: create GitHub release
    needs: [validate, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout (for scripts/release_check.py)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: artifacts

      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes

      - name: Verify SHA256SUMS
        working-directory: artifacts/dist
        run: sha256sum --strict -c ../SHA256SUMS

      - name: Create the release, or verify the existing one (only if the remote tag still names this run's commit)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          # The tag was checked in `validate`; re-resolve it now, peeling annotated tags, so
          # artifacts built from GITHUB_SHA are never attached to a tag that has since moved.
          read -r obj_type obj_sha < <(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" --jq '.object.type + " " + .object.sha')
          for _ in 1 2 3 4 5; do
            [ "$obj_type" = tag ] || break
            read -r obj_type obj_sha < <(gh api "repos/${GH_REPO}/git/tags/${obj_sha}" --jq '.object.type + " " + .object.sha')
          done
          if [ "$obj_type" != commit ] || [ "$obj_sha" != "$GITHUB_SHA" ]; then
            echo "::error::tag ${RELEASE_TAG} now resolves to ${obj_type} ${obj_sha}, not ${GITHUB_SHA}; refusing to release"
            exit 1
          fi
          # This endpoint returns published releases only (never drafts).
          lookup_status=0
          gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" --silent 2> "$RUNNER_TEMP/release-lookup.err" || lookup_status=$?
          if [ "$lookup_status" -eq 0 ]; then
            echo "A published release for ${RELEASE_TAG} already exists (re-run); comparing its assets with this run's files"
            existing="$RUNNER_TEMP/existing-release-assets"
            rm -rf "$existing"
            mkdir -p "$existing"
            gh release download "$RELEASE_TAG" --dir "$existing"
            python3 -I scripts/release_check.py release-assets \
              --dist artifacts/dist --sums artifacts/SHA256SUMS --downloaded "$existing"
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/release-lookup.err"; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "ferrum-migration ${RELEASE_VERSION} (preview)" \
              --notes-file release-notes/RELEASE_NOTES.md \
              artifacts/dist/* artifacts/SHA256SUMS
          else
            cat "$RUNNER_TEMP/release-lookup.err" >&2
            echo "::error::could not tell whether a release for ${RELEASE_TAG} exists"
            exit 1
          fi

  pypi:
    # Off until the owner has completed the one-time setup in docs/releasing.md (tag
    # rulesets, the `pypi` environment with required reviewers, the PyPI trusted publisher)
    # and set the repository variable PYPI_PUBLISH to `true`. No token secret is used.
    # Safe to re-run: only files PyPI does not have yet are uploaded, and a published file
    # whose SHA-256 differs from this run's build fails the job.
    name: publish to PyPI
    needs: [validate, github-release]
    # `pypi_publish` is the literal `true` or `false` written by the validate job.
    if: ${{ needs.validate.outputs.pypi_publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/ferrum-migration/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout (for scripts/release_check.py)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: artifacts

      - name: Verify SHA256SUMS
        working-directory: artifacts/dist
        run: sha256sum --strict -c ../SHA256SUMS

      - name: Select the files PyPI does not have yet (refuse SHA-256 mismatches)
        id: plan
        run: >-
          python3 -I scripts/release_check.py pypi-plan --dir artifacts/dist
          --upload-dir pypi-upload --github-output "$GITHUB_OUTPUT"

      - name: Publish with PyPI Trusted Publishing
        if: ${{ steps.plan.outputs.upload == 'true' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # Relative to the workspace: this is a container action, which sees only the
          # workspace mount, not the runner's temp directory.
          packages-dir: pypi-upload/
