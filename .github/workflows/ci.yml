name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow (release.yml) runs this whole workflow as its pre-publication gate.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-15
            python: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -e .

      - name: Byte-compile
        run: python -m compileall -q src tests acceptance scripts

      - name: Unit, fail-closed, CLI and load tests
        run: python -m unittest discover -s tests -v

      - name: Runtime harness self-tests (fake converter and fake gateway, loopback only)
        run: python -m unittest discover -s acceptance/tests -v

      - name: CLI smoke (all platforms, offline)
        shell: bash
        run: |
          set -u
          python -m ferrum_migration platforms
          for pair in kong:kong/kong.yaml nginx:nginx/nginx.conf traefik:traefik/dynamic.yaml \
                      traefik:traefik/dynamic.toml envoy:envoy/envoy.yaml istio:istio/istio.yaml; do
            platform="${pair%%:*}"; file="${pair#*:}"
            set +e
            python -m ferrum_migration check "tests/fixtures/$file" --from "$platform" > /dev/null
            code=$?
            set -e
            if [ "$code" -ne 0 ] && [ "$code" -ne 4 ]; then
              echo "unexpected exit $code for $file"; exit 1
            fi
          done

  package:
    # Builds the sdist and the wheel exactly as the release workflow does, checks them with
    # twine and scripts/release_check.py, and runs the installed wheel's console script.
    name: package (sdist + wheel, twine check)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-release.txt

      - name: Build sdist, then the wheel from the sdist
        run: python -m build --outdir dist .

      - name: twine check
        run: python -m twine check --strict dist/*

      - name: Check names, version and core metadata
        run: python scripts/release_check.py dist --dir dist

      - name: Install the wheel into a clean venv and run it
        run: bash scripts/smoke-wheel.sh dist

  ferrum-runtime:
    # Real Ferrum Edge admission and loopback runtime acceptance against the pinned published
    # release. No secrets are used. The binary is fetched from the public release and verified
    # against the release's .sha256 sidecar AND a digest pinned here. Nothing is uploaded as an
    # artifact: failed-case work dirs can contain per-run synthetic credentials and are deleted.
    # The check name stays the same when the pin moves, so a branch ruleset that requires it
    # does not need editing on every re-pin; the version is in FERRUM_EDGE_VERSION below.
    name: ferrum-edge pinned release admission + runtime acceptance (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FERRUM_EDGE_VERSION: v0.9.21
      FERRUM_EDGE_ASSET: ferrum-edge-linux-x86_64
      # SHA-256 of ferrum-edge-linux-x86_64 in the v0.9.21 release, cross-checked against the
      # GitHub release asset metadata and the release's published checksum file.
      FERRUM_EDGE_SHA256: 06fc247a35c49c5be160e947fd8284be4c5f594d331fce71cba1b87b87acce00
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -e .

      - name: Fetch and verify pinned ferrum-edge release binary
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "$FERRUM_EDGE_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::FERRUM_EDGE_SHA256 is not pinned to a 64-hex digest of ${FERRUM_EDGE_ASSET} ${FERRUM_EDGE_VERSION}"
            exit 1
          fi
          dir="$RUNNER_TEMP/ferrum-edge"
          mkdir -p "$dir"
          cd "$dir"
          base="https://github.com/ferrum-edge/ferrum-edge/releases/download/${FERRUM_EDGE_VERSION}"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$FERRUM_EDGE_ASSET" "$base/$FERRUM_EDGE_ASSET"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$FERRUM_EDGE_ASSET.sha256" "$base/$FERRUM_EDGE_ASSET.sha256"
          sha256sum -c "$FERRUM_EDGE_ASSET.sha256"
          echo "$FERRUM_EDGE_SHA256  $FERRUM_EDGE_ASSET" | sha256sum -c -
          chmod 0755 "$FERRUM_EDGE_ASSET"
          ./"$FERRUM_EDGE_ASSET" version --json
          echo "FERRUM_EDGE_BIN=$dir/$FERRUM_EDGE_ASSET" >> "$GITHUB_ENV"

      - name: Fetch pinned ferrum-edge v0.9.21 source for schema checks
        shell: bash
        run: |
          set -euo pipefail
          src_dir="$RUNNER_TEMP/ferrum-edge-src"
          mkdir -p "$src_dir"
          git -C "$src_dir" init -q
          git -C "$src_dir" fetch --depth 1 https://github.com/ferrum-edge/ferrum-edge.git f9915358c8032214f4034a17c28cdf72d14006c3
          git -C "$src_dir" checkout -q --detach FETCH_HEAD
          test "$(git -C "$src_dir" rev-parse HEAD)" = "f9915358c8032214f4034a17c28cdf72d14006c3"
          echo "FERRUM_EDGE_SRC=$src_dir" >> "$GITHUB_ENV"

      - name: Converter output passes ferrum-edge validate (synthetic CA for operator-CA fixtures)
        run: python -m unittest discover -s tests -p 'test_ferrum_reference.py' -v

      - name: Runtime smoke gate (one working migration per source, loopback)
        run: >-
          python acceptance/run.py --ferrum-bin "$FERRUM_EDGE_BIN" --strict --require-behavioral
          --converter-env "PYTHONPATH=$GITHUB_WORKSPACE/src" --work-root "$RUNNER_TEMP/acceptance-smoke"
          --case kong-dbless-smoke --case kong-deck-smoke --case nginx-proxy-pass-uri
          --case traefik-smoke --case envoy-smoke --case istio-smoke

      - name: Full runtime acceptance (loopback)
        run: >-
          python acceptance/run.py --ferrum-bin "$FERRUM_EDGE_BIN"
          --converter-env "PYTHONPATH=$GITHUB_WORKSPACE/src" --work-root "$RUNNER_TEMP/acceptance-full"

      - name: Remove work dirs (may hold per-run synthetic credentials)
        if: always()
        run: rm -rf "$RUNNER_TEMP/acceptance-smoke" "$RUNNER_TEMP/acceptance-full" "$RUNNER_TEMP/ferrum-edge" "$RUNNER_TEMP/ferrum-edge-src"
