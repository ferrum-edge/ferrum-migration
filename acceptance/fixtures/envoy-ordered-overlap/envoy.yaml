# Synthetic Envoy static v3 bootstrap: route order matters (first match wins).
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 127.0.0.1
          port_value: ${LISTEN_PORT}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: app
                      domains: ["app.example.test"]
                      routes:
                        # 1. regex listed BEFORE an overlapping prefix
                        - match:
                            safe_regex:
                              regex: "/api/.*\\.json"
                          route:
                            cluster: svc_b
                        - match:
                            prefix: "/api/"
                          route:
                            cluster: svc_a
                        # 2. broader prefix listed BEFORE a more specific one (which it shadows)
                        - match:
                            prefix: "/legacy/"
                          route:
                            cluster: svc_a
                        - match:
                            prefix: "/legacy/v2/"
                          route:
                            cluster: svc_b
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: svc_a
      type: STATIC
      connect_timeout: 1s
      load_assignment:
        cluster_name: svc_a
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: ${ECHO_A_PORT}
    - name: svc_b
      type: STATIC
      connect_timeout: 1s
      load_assignment:
        cluster_name: svc_b
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: ${ECHO_B_PORT}
