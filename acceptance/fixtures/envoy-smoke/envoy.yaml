# Synthetic Envoy v3 static bootstrap. Loopback only; the harness fills its upper-case placeholders.
static_resources:
  listeners:
    - name: smoke
      address:
        socket_address: {address: 127.0.0.1, port_value: ${LISTEN_PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: smoke
                route_config:
                  name: smoke
                  virtual_hosts:
                    - name: app
                      domains: ["app.example.test"]
                      routes:
                        - name: rewrite
                          match: {prefix: "/api/"}
                          route: {cluster: echo_a, prefix_rewrite: "/v1/"}
                        - name: exact
                          match: {path: "/status"}
                          route: {cluster: echo_b}
                        - name: deny-admin
                          match: {prefix: "/admin"}
                          direct_response:
                            status: 403
                            body: {inline_string: "denied"}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: echo_a
      type: STATIC
      connect_timeout: 1s
      load_assignment:
        cluster_name: echo_a
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: 127.0.0.1, port_value: ${ECHO_A_PORT}}
    - name: echo_b
      type: STATIC
      connect_timeout: 1s
      load_assignment:
        cluster_name: echo_b
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: 127.0.0.1, port_value: ${ECHO_B_PORT}}
