# Synthetic Kong DB-less config with key-auth. ${CANARY_KEY} is a random,
# per-run synthetic value generated by the harness; it is not a real credential.
_format_version: "3.0"
services:
  - name: svc-protected
    url: http://127.0.0.1:${ECHO_A_PORT}
    routes:
      - name: r-protected
        paths: ["/protected"]
        hosts: ["api.example.test"]
        strip_path: false
        plugins:
          - name: key-auth
            config:
              key_names: ["apikey"]
              key_in_header: true
              key_in_query: false
              key_in_body: false
              hide_credentials: false
consumers:
  - username: synthetic-acceptance-consumer
    keyauth_credentials:
      - key: ${CANARY_KEY}
