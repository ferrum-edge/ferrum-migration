# Synthetic NGINX config. Loopback only; the harness fills its upper-case placeholders.
worker_processes 1;
pid ${WORKDIR}/nginx.pid;
error_log ${WORKDIR}/logs/nginx-error.log warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_body_temp_path ${WORKDIR}/nginx-tmp/body;
    proxy_temp_path ${WORKDIR}/nginx-tmp/proxy;
    fastcgi_temp_path ${WORKDIR}/nginx-tmp/fastcgi;
    uwsgi_temp_path ${WORKDIR}/nginx-tmp/uwsgi;
    scgi_temp_path ${WORKDIR}/nginx-tmp/scgi;

    server {
        listen 127.0.0.1:${LISTEN_PORT};
        server_name app.example.test;

        # proxy_pass WITH a URI: the matched location prefix is replaced.
        location /svc/ {
            proxy_pass http://127.0.0.1:${ECHO_A_PORT}/inner/;
        }

        # proxy_pass WITHOUT a URI: the original request URI is passed unchanged.
        location /raw/ {
            proxy_pass http://127.0.0.1:${ECHO_B_PORT};
        }

        location = /exact {
            proxy_pass http://127.0.0.1:${ECHO_A_PORT};
        }
    }
}
