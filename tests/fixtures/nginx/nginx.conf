# Synthetic NGINX OSS configuration for ferrum-migration tests.
worker_processes auto;
events { worker_connections 1024; }

http {
    include mime.types;
    client_max_body_size 10m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    upstream app_backend {
        least_conn;
        server 10.0.0.11:8080 weight=2;
        server 10.0.0.12:8080;
        server 10.0.0.13:8080 backup;
    }

    server {
        listen 80;
        server_name example.com www.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name example.com www.example.com;
        ssl_certificate     /etc/nginx/tls/example.crt;
        ssl_certificate_key /etc/nginx/tls/example.key;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://app_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        location /internal/ {
            allow 10.0.0.0/8;
            deny all;
            proxy_pass http://app_backend;
        }

        location = /healthz {
            return 200 "ok";
        }

        location /uploads/ {
            client_max_body_size 100m;
            proxy_pass http://uploads.internal:9000;
        }

        location /private/ {
            deny all;
        }
    }
}
