[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ferrum-migration"
version = "0.1.0"
description = "Offline, best-effort, fail-closed translation of Kong, NGINX, Traefik, Envoy and Istio configuration into Ferrum Edge declarative config"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.1,<7"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Topic :: Internet :: Proxy Servers",
]

[project.scripts]
ferrum-migrate = "ferrum_migration.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
